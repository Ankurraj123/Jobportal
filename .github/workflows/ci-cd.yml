name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-deploy:
    name: Test, Build, Push Docker Image, Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        python manage.py test

    - name: Check Secrets Configuration
      id: secrets-check
      run: |
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "has_docker_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "has_docker_secrets=false" >> $GITHUB_OUTPUT
          echo "::warning::Docker Hub secrets (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are not set. Skipping Docker push."
        fi
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "has_render_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "has_render_secrets=false" >> $GITHUB_OUTPUT
          echo "::warning::Render deploy secret (RENDER_DEPLOY_HOOK_URL) is not set. Skipping Render deploy trigger."
        fi

    - name: Log in to Docker Hub
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.secrets-check.outputs.has_docker_secrets == 'true'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.secrets-check.outputs.has_docker_secrets == 'true'
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/django-job-portal:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/django-job-portal:${{ github.sha }}

    - name: Trigger Deploy on Render
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.secrets-check.outputs.has_render_secrets == 'true'
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
